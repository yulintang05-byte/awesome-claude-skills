<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3d0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crossGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#9b1a1a"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f7e08a"/>
      <stop offset="45%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8a6514"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#f7e08a"/>
      <stop offset="100%" stop-color="#8a6514"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- Rampant lion symbol (facing right, ~90x110 viewBox) -->
    <symbol id="lion" viewBox="0 0 90 110">
      <!-- Tail (curves up and over) -->
      <path d="M 18,88 Q 4,68 6,48 Q 8,30 18,26 Q 24,22 21,14"
            stroke="#c9a84c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- Tail tuft -->
      <path d="M 21,14 Q 14,5 22,8 Q 16,2 25,7 Q 20,0 28,6"
            stroke="#c9a84c" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Haunches -->
      <ellipse cx="26" cy="72" rx="13" ry="16" fill="#c9a84c"/>
      <!-- Body -->
      <ellipse cx="46" cy="58" rx="17" ry="20" fill="#c9a84c"/>
      <!-- Neck -->
      <ellipse cx="60" cy="36" rx="10" ry="14" fill="#c9a84c"/>

      <!-- Mane (ring of spiky petals) -->
      <polygon points="58,12 55,4  62,10" fill="#c9a84c"/>
      <polygon points="68,14 68,5  73,14" fill="#c9a84c"/>
      <polygon points="76,22 82,14 80,23" fill="#c9a84c"/>
      <polygon points="80,32 88,28 84,37" fill="#c9a84c"/>
      <polygon points="78,42 86,42 80,49" fill="#c9a84c"/>
      <polygon points="48,12 46,3  53,10" fill="#c9a84c"/>
      <polygon points="40,18 34,10 40,20" fill="#c9a84c"/>
      <polygon points="38,30 30,26 36,34" fill="#c9a84c"/>

      <!-- Head -->
      <circle cx="62" cy="26" r="16" fill="#c9a84c"/>

      <!-- Eye -->
      <circle cx="67" cy="22" r="3.5" fill="#4a0000"/>
      <circle cx="66" cy="21" r="1.2" fill="#fff" opacity="0.6"/>

      <!-- Open mouth / tongue -->
      <path d="M 71,32 Q 75,38 71,40 Q 67,38 71,32" fill="#cc1100"/>
      <path d="M 68,32 Q 71,35 74,32" fill="none" stroke="#4a0000" stroke-width="1"/>

      <!-- Raised front leg -->
      <rect x="72" y="42" width="11" height="20" rx="5" fill="#c9a84c"
            transform="rotate(-20 77 52)"/>
      <!-- Front paw raised -->
      <ellipse cx="80" cy="60" rx="8" ry="5" fill="#c9a84c"
               transform="rotate(-20 80 60)"/>
      <!-- Claws on raised paw -->
      <path d="M 75,62 L 72,68 M 80,63 L 78,69 M 85,62 L 83,68"
            stroke="#4a0000" stroke-width="1.5" stroke-linecap="round"
            transform="rotate(-20 80 65)"/>

      <!-- Lower front leg -->
      <rect x="58" y="68" width="10" height="22" rx="4" fill="#c9a84c"/>
      <ellipse cx="63" cy="89" rx="8" ry="4" fill="#c9a84c"/>
      <path d="M 57,88 L 55,94 M 62,89 L 61,95 M 67,88 L 66,94"
            stroke="#4a0000" stroke-width="1.3" stroke-linecap="round"/>

      <!-- Back lower leg -->
      <rect x="20" y="82" width="10" height="20" rx="4" fill="#c9a84c"/>
      <ellipse cx="25" cy="101" rx="9" ry="4" fill="#c9a84c"/>
    </symbol>
  </defs>

  <!-- ══════════════════════════════════════ -->
  <!--        AMBIENT BACKGROUND GLOW         -->
  <!-- ══════════════════════════════════════ -->
  <circle cx="300" cy="300" r="290" fill="url(#bgGlow)"/>

  <!-- ══════════════════════════════════════ -->
  <!--        OUTER GOLD RING + ROPE          -->
  <!-- ══════════════════════════════════════ -->
  <circle cx="300" cy="300" r="276" fill="none" stroke="#c9a84c" stroke-width="8" opacity="0.4"/>
  <circle cx="300" cy="300" r="265" fill="none" stroke="#8a6514" stroke-width="2" opacity="0.5"/>

  <!-- ══════════════════════════════════════ -->
  <!--       MALTESE / CROSS PATTÉE           -->
  <!-- ══════════════════════════════════════ -->

  <!-- Cross outer gold shadow/glow -->
  <polygon points="
    240,240  195,60  245,55  300,105  355,55  405,60  360,240
    540,195  545,245 495,300  545,355  540,405  360,360
    405,540  355,545 300,495  245,545  195,540  240,360
     60,405   55,355  105,300  55,245   60,195
  " fill="#c9a84c" opacity="0.3" filter="url(#glow)"/>

  <!-- Cross gold border (slightly larger) -->
  <polygon points="
    237,237  190,56  241,50  300,102  359,50  410,56  363,237
    544,191  550,241 498,300  550,359  544,409  363,363
    410,544  359,550 300,498  241,550  190,544  237,363
     56,409   50,359  102,300  50,241   56,191
  " fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Cross crimson body -->
  <polygon points="
    243,243  198,64  248,59  300,108  352,59  402,64  357,243
    536,198  541,248 492,300  541,352  536,402  357,357
    402,536  352,541 300,492  248,541  198,536  243,357
     64,402   59,352  108,300  59,248   64,198
  " fill="url(#crossGrad)"/>

  <!-- Cross inner highlight (top-left lighter edge) -->
  <polygon points="
    243,243  198,64  248,59  300,108  352,59  402,64  357,243
    536,198  541,248 492,300  541,352  536,402  357,357
    402,536  352,541 300,492  248,541  198,536  243,357
     64,402   59,352  108,300  59,248   64,198
  " fill="none" stroke="#cc2222" stroke-width="2" opacity="0.5"/>

  <!-- Subtle inner bevel lines on each arm -->
  <line x1="270" y1="243" x2="248" y2="64"  stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="330" y1="243" x2="352" y2="64"  stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="357" y1="270" x2="536" y2="248" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="357" y1="330" x2="536" y2="352" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="330" y1="357" x2="352" y2="536" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="270" y1="357" x2="248" y2="536" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="243" y1="330" x2="64"  y2="352" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>
  <line x1="243" y1="270" x2="64"  y2="248" stroke="#cc3333" stroke-width="1.5" opacity="0.35"/>

  <!-- ══════════════════════════════════════ -->
  <!--        GOLD TIP ORNAMENTS              -->
  <!-- ══════════════════════════════════════ -->
  <!-- Small gold roundel at each of the 8 prong tips -->
  <circle cx="300" cy="83"  r="10" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5"/>
  <circle cx="300" cy="517" r="10" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5"/>
  <circle cx="83"  cy="300" r="10" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5"/>
  <circle cx="517" cy="300" r="10" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5"/>
  <!-- Four prong-tips (diagonal) -->
  <circle cx="247" cy="56"  r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="353" cy="56"  r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="247" cy="544" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="353" cy="544" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="56"  cy="247" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="56"  cy="353" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="544" cy="247" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>
  <circle cx="544" cy="353" r="7" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1"/>

  <!-- ══════════════════════════════════════ -->
  <!--         LIONS IN EACH ARM              -->
  <!-- ══════════════════════════════════════ -->

  <!-- TOP arm lion (facing right, centered ~300,165) -->
  <g transform="translate(255,120) scale(0.56)">
    <use href="#lion"/>
  </g>

  <!-- BOTTOM arm lion (facing left, flip horizontally, centered ~300,435) -->
  <g transform="translate(345,395) scale(-0.56, 0.56)">
    <use href="#lion"/>
  </g>

  <!-- RIGHT arm lion (rotated 90° CW, centered ~435,300) -->
  <g transform="translate(435,260) rotate(90) scale(0.56) translate(-45,-55)">
    <use href="#lion"/>
  </g>

  <!-- LEFT arm lion (rotated 90° CCW / facing up-left, centered ~165,300) -->
  <g transform="translate(165,340) rotate(-90) scale(0.56) translate(-45,-55)">
    <use href="#lion"/>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!--         CENTRAL MEDALLION              -->
  <!-- ══════════════════════════════════════ -->

  <!-- Center gold ring -->
  <circle cx="300" cy="300" r="70" fill="url(#centerGrad)" stroke="#8a6514" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="300" cy="300" r="62" fill="#4a0000" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="58" fill="#5a0a0a"/>

  <!-- Central lion (smaller, in the medallion) -->
  <g transform="translate(265,255) scale(0.42)">
    <use href="#lion"/>
  </g>

  <!-- Center jewel dot -->
  <circle cx="300" cy="300" r="6" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Medallion outer ornament ring (dotted) -->
  <circle cx="300" cy="300" r="74" fill="none" stroke="#c9a84c" stroke-width="1"
          stroke-dasharray="4 6" opacity="0.7"/>

</svg>
