<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720">
  <defs>
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#1a2a6c"/>
      <stop offset="50%"  stop-color="#0d1b4b"/>
      <stop offset="100%" stop-color="#060d28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f7e08a"/>
      <stop offset="40%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8a6514"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8a6514"/>
      <stop offset="40%"  stop-color="#c9a84c"/>
      <stop offset="60%"  stop-color="#f7e08a"/>
      <stop offset="100%" stop-color="#8a6514"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <radialGradient id="shieldInner" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#243580" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060d28" stop-opacity="1"/>
    </radialGradient>
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Small Maltese cross symbol -->
    <symbol id="sm-cross" viewBox="-32 -32 64 64">
      <polygon points="
        -8,-8  -7,-26  0,-18  7,-26  8,-8
         26,-7  18,0   26,7   8,8
         7,26   0,18  -7,26  -8,8
        -26,7  -18,0  -26,-7
      " fill="#1b4332" stroke="#c9a84c" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- ══════════════════════════════════════ -->
  <!--              MANTLING                  -->
  <!-- ══════════════════════════════════════ -->

  <!-- Left mantling - black silk with gold edge -->
  <path d="
    M 188,135
    C 140,165 95,220 82,295
    C 70,360 82,415 105,448
    C 118,466 112,480  95,500
    C 82,516  88,528 108,512
    C 124,499 128,482 122,466
    C 138,486 148,502 138,524
    C 132,540 144,545 158,528
    C 170,512 167,492 158,472
    C 173,490 184,506 178,528
    C 173,545 186,549 197,532
    C 208,514 205,492 194,468
    C 186,448 195,415 202,388
    C 210,356 215,305 204,258
    C 196,220 198,172 208,138
    Z
  " fill="#111111" stroke="#c9a84c" stroke-width="1.5" opacity="0.95"/>
  <!-- Gold lining trace left -->
  <path d="
    M 205,140 C 198,175 196,220 204,258
    C 215,305 210,356 202,388
    C 195,415 186,448 194,468
    C 203,490 204,512 196,530
  " fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Right mantling - mirror -->
  <path d="
    M 412,135
    C 460,165 505,220 518,295
    C 530,360 518,415 495,448
    C 482,466 488,480 505,500
    C 518,516 512,528 492,512
    C 476,499 472,482 478,466
    C 462,486 452,502 462,524
    C 468,540 456,545 442,528
    C 430,512 433,492 442,472
    C 427,490 416,506 422,528
    C 427,545 414,549 403,532
    C 392,514 395,492 406,468
    C 414,448 405,415 398,388
    C 390,356 385,305 396,258
    C 404,220 402,172 392,138
    Z
  " fill="#111111" stroke="#c9a84c" stroke-width="1.5" opacity="0.95"/>
  <!-- Gold lining trace right -->
  <path d="
    M 395,140 C 402,175 404,220 396,258
    C 385,305 390,356 398,388
    C 405,415 414,448 406,468
    C 397,490 396,512 404,530
  " fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- ══════════════════════════════════════ -->
  <!--               SHIELD                   -->
  <!-- ══════════════════════════════════════ -->

  <!-- Shield outer glow -->
  <path d="
    M 118,148 C 118,98 174,72 300,72
    C 426,72 482,98 482,148
    L 482,335 C 482,462 390,542 300,588
    C 210,542 118,462 118,335 Z
  " fill="#c9a84c" opacity="0.15" transform="translate(0,4)"/>

  <!-- Shield body -->
  <path d="
    M 122,148 C 122,100 176,75 300,75
    C 424,75 478,100 478,148
    L 478,332 C 478,458 388,538 300,582
    C 212,538 122,458 122,332 Z
  " fill="url(#shieldInner)" stroke="#c9a84c" stroke-width="4.5" filter="url(#dropshadow)"/>

  <!-- Shield inner bevel (lighter edge) -->
  <path d="
    M 136,156 C 136,112 184,90 300,90
    C 416,90 464,112 464,156
    L 464,330 C 464,448 381,522 300,564
    C 219,522 136,448 136,330 Z
  " fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>

  <!-- ══════════════════════════════════════ -->
  <!--         CROSS (GREEN + GOLD)           -->
  <!-- ══════════════════════════════════════ -->

  <!-- Cross gold outer border -->
  <rect x="261" y="110" width="78" height="453" rx="3" fill="url(#goldGrad)"/>
  <rect x="146" y="272" width="308" height="78" rx="3" fill="url(#goldH)"/>

  <!-- Cross green fill -->
  <rect x="268" y="117" width="64" height="439" rx="2" fill="url(#crossGrad)"/>
  <rect x="153" y="279" width="294" height="64" rx="2" fill="url(#crossGrad)"/>

  <!-- Cross highlight (subtle light left edge) -->
  <rect x="268" y="117" width="10" height="439" rx="2" fill="#40916c" opacity="0.45"/>
  <rect x="153" y="279" width="294" height="10" rx="2" fill="#40916c" opacity="0.45"/>

  <!-- Cross center jewel -->
  <circle cx="300" cy="310" r="18" fill="#c9a84c" stroke="#8a6514" stroke-width="2"/>
  <circle cx="300" cy="310" r="11" fill="#1b4332"/>
  <circle cx="300" cy="310" r="5"  fill="#40916c" opacity="0.9"/>

  <!-- ══════════════════════════════════════ -->
  <!--     QUADRANT ORNAMENTAL CROSSES        -->
  <!-- ══════════════════════════════════════ -->
  <use href="#sm-cross" x="202" y="198" width="48" height="48"/>
  <use href="#sm-cross" x="376" y="198" width="48" height="48"/>
  <use href="#sm-cross" x="202" y="390" width="48" height="48"/>
  <use href="#sm-cross" x="376" y="390" width="48" height="48"/>

  <!-- ══════════════════════════════════════ -->
  <!--               CROWN                    -->
  <!-- ══════════════════════════════════════ -->

  <!-- Crown base band -->
  <rect x="182" y="96" width="236" height="40" rx="6" fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5"/>

  <!-- Crown points (alternating tall/short) -->
  <polygon points="
    182,96
    196,52  218,82
    246,38  268,72
    300,28  332,72
    354,38  382,82
    404,52  418,96
  " fill="url(#goldGrad)" stroke="#8a6514" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Crown pearls (on short points) -->
  <circle cx="218" cy="80" r="7" fill="#f5f0e8" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="382" cy="80" r="7" fill="#f5f0e8" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Crown gems (on tall points) -->
  <circle cx="246" cy="40" r="8" fill="#8B0000" stroke="#8a6514" stroke-width="1.5"/>
  <circle cx="300" cy="30" r="10" fill="#006400" stroke="#8a6514" stroke-width="1.5"/>
  <circle cx="354" cy="40" r="8" fill="#00008B" stroke="#8a6514" stroke-width="1.5"/>
  <!-- Gem shine dots -->
  <circle cx="244" cy="37" r="2" fill="#ffaaaa" opacity="0.8"/>
  <circle cx="298" cy="27" r="3" fill="#aaffaa" opacity="0.8"/>
  <circle cx="352" cy="37" r="2" fill="#aaaaff" opacity="0.8"/>

  <!-- Crown top cross finial -->
  <rect x="296" y="14" width="8" height="18" rx="2" fill="url(#goldGrad)"/>
  <rect x="290" y="18" width="20" height="6" rx="2" fill="url(#goldGrad)"/>
  <circle cx="300" cy="12" r="4" fill="#f7e08a" stroke="#8a6514" stroke-width="1"/>

  <!-- Crown band details -->
  <circle cx="210" cy="116" r="4" fill="#f7e08a" opacity="0.8"/>
  <circle cx="250" cy="116" r="4" fill="#f7e08a" opacity="0.8"/>
  <circle cx="300" cy="116" r="4" fill="#f7e08a" opacity="0.8"/>
  <circle cx="350" cy="116" r="4" fill="#f7e08a" opacity="0.8"/>
  <circle cx="390" cy="116" r="4" fill="#f7e08a" opacity="0.8"/>

  <!-- ══════════════════════════════════════ -->
  <!--       CONNECTING RIBBON + BANNER       -->
  <!-- ══════════════════════════════════════ -->

  <!-- Ribbon from shield base to banner -->
  <path d="M 252,580 Q 276,592 300,596 Q 324,592 348,580 L 348,606 Q 324,618 300,622 Q 276,618 252,606 Z"
        fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Banner scroll shadow -->
  <path d="M 150,614 Q 300,636 450,614 L 450,656 Q 300,678 150,656 Z"
        fill="#000" opacity="0.18" transform="translate(3,4)"/>

  <!-- Banner body -->
  <path d="M 152,614 Q 300,636 448,614 L 448,656 Q 300,678 152,656 Z"
        fill="#f5f0e8" stroke="#c9a84c" stroke-width="2.5"/>

  <!-- Left scroll curl -->
  <path d="M 152,614 L 138,607 L 136,663 L 152,656" fill="#e2d4b8" stroke="#c9a84c" stroke-width="1.5"/>
  <path d="M 138,607 L 128,612 L 126,658 L 136,663" fill="#ccc0a0" stroke="#c9a84c" stroke-width="1"/>

  <!-- Right scroll curl -->
  <path d="M 448,614 L 462,607 L 464,663 L 448,656" fill="#e2d4b8" stroke="#c9a84c" stroke-width="1.5"/>
  <path d="M 462,607 L 472,612 L 474,658 L 464,663" fill="#ccc0a0" stroke="#c9a84c" stroke-width="1"/>

  <!-- Motto text -->
  <text x="300" y="640"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17"
        font-weight="bold"
        letter-spacing="5"
        fill="#1a1a2e">CRUX · AETERNA</text>

  <!-- Small decorative cross flanking motto -->
  <text x="170" y="640" text-anchor="middle" font-family="serif" font-size="13" fill="#1b4332">✦</text>
  <text x="430" y="640" text-anchor="middle" font-family="serif" font-size="13" fill="#1b4332">✦</text>

</svg>
